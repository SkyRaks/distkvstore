apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: raft
  labels:
    app: raft
spec:
  serviceName: raft
  replicas: 3
  selector:
    matchLabels:
      app: raft
  template:
    metadata:
      labels:
        app: raft
    spec:
      containers:
      - name: raft-node
        image: raft-node:v1
        ports:
        - containerPort: 8080
      volumes:
      - name: pod-info
        downwardAPI:
          items:
          # i don't understand this syntax
            - path: "id"
              fieldRef:
                fieldPath: metadata.name
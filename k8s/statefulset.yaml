apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: raft
  labels:
    app: raft
spec:
  replicas: 3
  selector:
    matchLabels:
      app: raft
  template:
    metadata:
      labels:
        app: raft
    spec:
      containers:
      - name: raft-node
        image: raft-node:v1
        ports:
        - containerPort: 8080
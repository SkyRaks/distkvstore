apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: raft
  labels:
    app: raft
spec:
  serviceName: raft
  replicas: 3
  selector:
    matchLabels:
      app: raft
  template:
    metadata:
      labels:
        app: raft
    spec:
      containers:
      - name: raft-node
        image: raft-node:v1
        ports:
        - containerPort: 8080
        env:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
        args: ["-id", "$(POD_NAME)", "-peers", "raft-0.raft:8080,raft-1.raft:8080,raft-2.raft:8080"]
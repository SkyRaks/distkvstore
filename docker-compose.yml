services:
  node1:
    build: .
    container_name: node1
    command: ["-addr", ":8080", "-id", "node1", "-peers", "node2:8081,node3:8082", "-state-dir", "/node1"]
    ports:
      - "8080:8080"
    volumes:
      - ./raft-logs/node1:/node1
  node2:
    build: .
    container_name: node2
    command: ["-addr", ":8081", "-id", "node2", "-peers", "node1:8080,node3:8082", "-state-dir", "/node2"]
    ports:
      - "8081:8081"
    volumes:
      - ./raft-logs/node2:/node2
  node3:
    build: .
    container_name: node3
    command: ["-addr", ":8082", "-id", "node3", "-peers", "node1:8080,node2:8081", "-state-dir", "/node3"]
    ports:
      - "8082:8082"
    volumes:
      - ./raft-logs/node3:/node3
